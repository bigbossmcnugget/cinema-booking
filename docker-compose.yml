services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: cinema
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-cinema_dev}
      POSTGRES_DB: cinema
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - cinema_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cinema -d cinema"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  cinema_postgres:
